<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Am Sorry ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #5a005a, transparent 45%),
                linear-gradient(135deg, #120012, #30002f, #100010);

            color: white;
        }


        /* =========================================
           BACKGROUND HEARTS
        ========================================= */

        .heart {
            position: fixed;
            bottom: -60px;

            font-size: 24px;

            opacity: 0;

            pointer-events: none;

            animation: heartUp 6s linear infinite;
        }


        @keyframes heartUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            5% {
                opacity: 0.7;
            }

            95% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }

        }


        /* Different heart speeds */

        .heart1 {
            left: 8%;
            animation-delay: 0s;
        }

        .heart2 {
            left: 25%;
            animation-delay: 1.5s;
        }

        .heart3 {
            left: 45%;
            animation-delay: 3s;
        }

        .heart4 {
            left: 65%;
            animation-delay: 0.8s;
        }

        .heart5 {
            left: 85%;
            animation-delay: 2.3s;
        }


        /* =========================================
           MAIN FIRST SCREEN
        ========================================= */

        .container {

            width: 90%;
            max-width: 500px;

            padding: 45px 25px;

            text-align: center;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                0 0 40px rgba(255, 0, 150, 0.3);

            z-index: 2;


            /* Direct top to bottom animation */
            animation: screenDrop 1.2s ease-out forwards;
        }


        @keyframes screenDrop {

            0% {
                transform: translateY(-120vh);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }

        }


        /* =========================================
           TITLE
        ========================================= */

        .title {

            font-size: 48px;

            font-weight: bold;

            text-shadow:
                0 0 10px rgba(255, 120, 200, 0.8),
                0 0 25px rgba(255, 20, 147, 0.5);

            animation: titleGlow 1.8s ease-in-out infinite;
        }


        @keyframes titleGlow {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

        }


        /* =========================================
           SUBTITLE
        ========================================= */

        .subtitle {

            margin-top: 18px;

            font-size: 20px;

            color: #ffe6f5;

            opacity: 0.9;
        }


        /* =========================================
           BUTTON
        ========================================= */

        button {

            margin-top: 35px;

            padding: 16px 35px;

            border: none;

            border-radius: 50px;

            font-size: 18px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    45deg,
                    #ff1493,
                    #ff4da6
                );

            box-shadow:
                0 0 20px rgba(255, 20, 147, 0.5);

            transition: 0.3s;
        }


        button:hover {

            transform: scale(1.08);

            box-shadow:
                0 0 40px rgba(255, 20, 147, 0.8);
        }


        button:active {

            transform: scale(0.95);
        }


        /* =========================================
           POPUP BACKGROUND
        ========================================= */

        .popup-bg {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.78);

            backdrop-filter: blur(10px);

            z-index: 20;
        }


        /* =========================================
           POPUP BOX
        ========================================= */

        .popup {

            width: 90%;

            max-width: 520px;

            padding: 40px 25px;

            text-align: center;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    #3d0035,
                    #160015
                );

            border:
                1px solid rgba(255, 255, 255, 0.2);

            box-shadow:
                0 0 60px rgba(255, 20, 147, 0.5);

            animation:
                popupOpen 0.6s ease-out forwards;
        }


        @keyframes popupOpen {

            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            70% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }


        /* =========================================
           POPUP TITLE
        ========================================= */

        .popup h2 {

            font-size: 40px;

            margin-bottom: 20px;

            color: white;

            text-shadow:
                0 0 15px rgba(255, 100, 200, 0.8);
        }


        /* =========================================
           POPUP MESSAGE
        ========================================= */

        .popup p {

            font-size: 19px;

            line-height: 1.7;

            color: #ffe6f5;
        }


        /* =========================================
           LOVE MESSAGE
        ========================================= */

        .love {

            margin-top: 25px;

            font-size: 30px;

            font-weight: bold;

            animation:
                lovePulse 1.5s infinite;
        }


        @keyframes lovePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

        }


        /* =========================================
           POPUP FLOATING HEARTS
        ========================================= */

        .popHeart {

            position: fixed;

            font-size: 30px;

            pointer-events: none;

            z-index: 30;

            animation:
                popHeartAnimation 2.5s ease-out forwards;
        }


        @keyframes popHeartAnimation {

            0% {

                transform:
                    translateY(0)
                    scale(0.5)
                    rotate(0deg);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-350px)
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================================
           MOBILE RESPONSIVE
        ========================================= */

        @media (max-width: 600px) {

            .container {
                padding: 40px 20px;
            }

            .title {
                font-size: 38px;
            }

            .subtitle {
                font-size: 17px;
            }

            button {
                font-size: 16px;
                padding: 14px 28px;
            }

            .popup {
                padding: 35px 20px;
            }

            .popup h2 {
                font-size: 32px;
            }

            .popup p {
                font-size: 17px;
            }

            .love {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND HEARTS
    ========================================== -->

    <div class="heart heart1">❤️</div>
    <div class="heart heart2">💗</div>
    <div class="heart heart3">💕</div>
    <div class="heart heart4">💖</div>
    <div class="heart heart5">❤️</div>


    <!-- =========================================
         FIRST SCREEN
    ========================================== -->

    <div class="container">

        <div class="title">
            I AM SORRY 🥺❤️
        </div>


        <div class="subtitle">
            Please click once... 🫶🏻
        </div>


        <button onclick="showSorry()">
            💗 Tap Here 💗
        </button>

    </div>



    <!-- =========================================
         APOLOGY POPUP
    ========================================== -->

    <div class="popup-bg" id="popup">

        <div class="popup">

            <h2>
                I'm Really Sorry 🥺❤️
            </h2>


            <p>

                I know I made you angry... 🥺
                <br>

                And honestly,
                I never wanted to hurt you.

                <br><br>

                Please mujhe maaf kar do na ❤️

                <br><br>

                You mean a lot to me,
                and I never want to lose
                the smile on your face. 🫶🏻

            </p>


            <div class="love">
                I Love Youuuu ❤️♾️
            </div>

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        function showSorry() {

            /* Show popup */

            document.getElementById("popup").style.display = "flex";


            /* Heart emojis */

            const hearts = [
                "❤️",
                "💗",
                "💕",
                "💖",
                "💓",
                "🥺",
                "🫶🏻"
            ];


            /* Create hearts */

            for (let i = 0; i < 30; i++) {

                const heart =
                    document.createElement("div");


                heart.className =
                    "popHeart";


                heart.innerHTML =
                    hearts[
                        Math.floor(
                            Math.random() * hearts.length
                        )
                    ];


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.top =
                    (60 + Math.random() * 30) + "vh";


                heart.style.animationDuration =
                    (1.5 + Math.random() * 1.5) + "s";


                document.body.appendChild(heart);


                /* Remove after animation */

                setTimeout(() => {

                    heart.remove();

                }, 3500);

            }

        }

    </script>


</body>

</html>
